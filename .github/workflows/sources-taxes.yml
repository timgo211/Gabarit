# Phase 5h — lecture des sources bloquées depuis le conteneur de développement (R-Pass, ECPL Grand Est, Maut,
# GO-Maut, RPLP, Viapass). Journal seulement : aucune donnée écrite, aucun commit. Lancé quand ce fichier change, sur
# cette branche seulement (un lancement à la main exige le workflow sur main : GitHub répond 404).
# À RETIRER AVANT LE MERGE de la PR de la phase 5h.
name: Sources taxes PL (lecture, phase 5h)

on:
  workflow_dispatch:
  push:
    branches:
      - ccr-fdafe3a9-5ipepl
    paths:
      - .github/workflows/sources-taxes.yml

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Outils
        run: sudo apt-get install -y poppler-utils > /dev/null
      - name: Lire les pages
        shell: python3 {0}
        run: |
          import re, html, subprocess, urllib.request, urllib.parse, datetime
          UA = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) Gabarit-sources/1.0'}
          KEY = re.compile(r'(?i)r-pass|1er janvier 2027|01/01/2027|janvier 2027|avril 2027|2027|tarif|bar[èe]me|centimes|€\s*/\s*km|'
                           r'euro\s*[0-6ivx]|essieu|ptac|tonnes?|recours|suspens|r[ée]f[ée]r[ée]|d[ée]lib[ée]ration|tron[çc]on|portique|'
                           r'M35|A35|A36|RN\s?83|Mautsatz|Mautsätze|Achs|Tarif|tarieven|indexering|indexation|Lkw-Maut|Grundkilometer')
          print('Lecture du', datetime.datetime.utcnow().isoformat(timespec='minutes'), 'UTC')

          DIGEST = []
          STRICT = re.compile(r'(?i)r-pass|ecpl|[ée]cocontribution|2027|centimes|€\s*/\s*km|cts?/km|c€|euro\s*(?:[0-6]|vi?|iv|eev)|essieux|recours|suspen|r[ée]f[ée]r[ée]|d[ée]lib[ée]ration|portique|tron[çc]on|Mautsatz|Mautsätze|Mauttarif|Grundkilometer|Achsen|indexering|indexation|tarif')

          def note(url, t):
            hits, last = [], -10**9
            for m in STRICT.finditer(t or ''):
              if m.start() - last < 500: continue
              last = m.start()
              hits.append(t[max(0, m.start() - 170):m.end() + 170].replace('\n', ' '))
              if len(hits) >= 3: break
            DIGEST.append((url, 'OK ' + str(len(t or '')) + ' car.', hits))

          import ssl, socket, os
          EXTRA = {}

          def aia_context(host):
            # Serveur qui n'envoie pas son certificat intermédiaire : on le télécharge à l'adresse « CA Issuers » (AIA)
            # du certificat, on l'ajoute aux autorités du système, et la vérification reste active.
            if host in EXTRA: return EXTRA[host]
            ctx = None
            try:
              pem = ssl.get_server_certificate((host, 443))
              open('/tmp/leaf.pem', 'w').write(pem)
              txt = subprocess.run(['openssl', 'x509', '-in', '/tmp/leaf.pem', '-noout', '-text'], capture_output=True, text=True).stdout
              m = re.search(r'CA Issuers - URI:(\S+)', txt)
              print('  AIA', host, m.group(1) if m else '(aucune)')
              if m:
                der = urllib.request.urlopen(m.group(1), timeout=30).read()
                open('/tmp/inter.der', 'wb').write(der)
                fmt = 'PEM' if der.startswith(b'-----') else 'DER'
                inter = subprocess.run(['openssl', 'x509', '-inform', fmt, '-in', '/tmp/inter.der'], capture_output=True, text=True).stdout
                ctx = ssl.create_default_context()
                ctx.load_verify_locations(cadata=inter)
            except Exception as e:
              print('  AIA ÉCHEC', host, e)
            EXTRA[host] = ctx
            return ctx

          def get(url, data=None, headers=None):
            try:
              h = dict(UA); h.update(headers or {})
              host = urllib.parse.urlparse(url).netloc
              ctx = EXTRA.get(host)
              try:
                with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=h), timeout=90, context=ctx) as r:
                  return r.read(), r.headers.get_content_type()
              except urllib.error.URLError as e:
                if 'CERTIFICATE_VERIFY_FAILED' not in str(e) or host in EXTRA: raise
                ctx = aia_context(host)
                if ctx is None: raise
                with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=h), timeout=90, context=ctx) as r:
                  return r.read(), r.headers.get_content_type()
            except Exception as e:
              print('  ÉCHEC', url, e)
              DIGEST.append((url, 'ÉCHEC ' + str(e)[:120], []))
              return None, None

          def text_of(data, ctype):
            if ctype == 'application/pdf' or data[:4] == b'%PDF':
              open('/tmp/p.pdf', 'wb').write(data)
              return subprocess.run(['pdftotext', '-layout', '/tmp/p.pdf', '-'], capture_output=True, text=True).stdout
            t = data.decode('utf-8', 'ignore')
            t = re.sub(r'(?s)<script.*?</script>|<style.*?</style>', ' ', t)
            return re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', t)))

          def snippets(t, width=350, limit=30):
            n, last = 0, -10**9
            for m in KEY.finditer(t):
              if n >= limit: break
              if m.start() - last < width: continue
              last = m.start(); n += 1
              print('   …', t[max(0, m.start() - width):m.end() + width].replace('\n', ' '), '…')
            if n == 0: print('   (aucun mot-clé)')

          def full(url, limit=15000):
            print('\n=====', url)
            data, ctype = get(url)
            if data is None: return
            t = text_of(data, ctype)
            note(url, t)
            print('(' + str(ctype) + ', ' + str(len(t)) + ' caractères)')
            print(t[:limit])

          def crawl(start, words, maxpages=25):
            print('\n##########', start)
            data, ctype = get(start)
            if data is None: return
            host = urllib.parse.urlparse(start).netloc
            raw = data.decode('utf-8', 'ignore')
            links = []
            for h in re.findall(r'href="([^"#]+)"', raw):
              u = urllib.parse.urljoin(start, html.unescape(h))
              if urllib.parse.urlparse(u).netloc != host and not u.lower().endswith('.pdf'): continue
              if any(w in u.lower() for w in words) and u not in links: links.append(u)
            print('Liens retenus :', len(links))
            for u in links: print('   lien', u)
            for u in [start] + links[:maxpages]:
              d, c = get(u)
              if d is None: continue
              t = text_of(d, c)
              note(u, t)
              print('\n=====', u, '(' + str(c) + ', ' + str(len(t)) + ' caractères)')
              snippets(t)

          def links(start, words):
            d, c = get(start)
            if d is None: return []
            host = urllib.parse.urlparse(start).netloc
            out = []
            for h in re.findall(r'href="([^"#]+)"', d.decode('utf-8', 'ignore')):
              u = urllib.parse.urljoin(start, html.unescape(h))
              if (urllib.parse.urlparse(u).netloc == host or u.lower().endswith('.pdf')) and any(w in u.lower() for w in words) and u not in out: out.append(u)
            print('\n##### liens de', start); [print('   lien', u) for u in out]
            return out

          # R-Pass : site officiel r-pass.eu (chaîne de certificat incomplète : intermédiaire lu par AIA).
          for u in ['https://www.r-pass.eu/', 'https://r-pass.eu/']:
            full(u, 12000)
          for u in links('https://www.r-pass.eu/', ['r-pass', 'tarif', 'reseau', 'réseau', 'carte', 'faq', 'deliberation', 'délibération', 'pdf', 'exoner', 'exonér', 'actualit', 'vehicule', 'véhicule', 'propos', 'about', '/fr'])[:25]:
            full(u, 12000)
          full('https://www.alsace.eu/', 4000)
          for u in links('https://www.alsace.eu/', ['r-pass', 'rpass', 'deliber', 'délibér', 'poids-lourds', 'transport'])[:10]:
            full(u, 12000)

          # Écocontribution Grand Est : textes complets.
          for u in ['https://ecpl.fr/fr/network', 'https://ecpl.fr/fr/rates-and-network', 'https://ecpl.fr/fr/about', 'https://ecpl.fr/fr/faq', 'https://ecpl.fr/fr/news', 'https://ecpl.fr/fr/exemptions']:
            full(u, 12000)
          for u in links('https://ecpl.fr/fr/rates-and-network', ['tarif', 'grille', 'rate', 'pdf', 'network', 'reseau', 'carte', 'map', 'annonce', 'news', 'actualit'])[:15]:
            full(u, 12000)
          for u in links('https://ecpl.fr/fr/about', ['annonce', 'news', 'actualit', 'deliber', 'pdf', 'grandest'])[:10]:
            full(u, 8000)

          # Viapass : modifications au 1er janvier 2027 (texte complet).
          full('https://www.viapass.be/actualites/prelevement-kilometrique-les-modifications-prevues-a-partir-du-1er-janvier-2027.html', 12000)

          # Toll Collect, BFStrMG, ASFINAG, RIS : nouvel essai.
          full('https://www.toll-collect.de/de/toll_collect/bezahlen/maut_tarife/maut_tarife.html', 6000)
          for a in ['', 'anlage_1.html']:
            full('https://www.gesetze-im-internet.de/bfstrmg/' + a, 12000)
          full('https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=20004016', 8000)
          full('https://www.asfinag.at/maut-vignette/lkw-bus/', 6000)

          print('\n\n################ RÉSUMÉ ################')
          for url, st, hits in DIGEST:
            print('@@', url, '→', st)
