# Phase 5g — lecture des sources bloquées depuis le conteneur de développement (RIS Tyrol, SFTRF, SITAF, TMB).
# Journal seulement : aucune donnée écrite, aucun commit. Lancé à la main ou quand ce fichier change.
# À RETIRER AVANT LE MERGE de la PR de la phase 5g.
name: Sources Euro (lecture, phase 5g)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sources-euro.yml

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Outils
        run: sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-fra > /dev/null
      - name: Lire les pages
        shell: python3 {0}
        run: |
          import re, html, subprocess, urllib.request, urllib.parse, datetime
          UA = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) Gabarit-sources/1.0'}
          KEY = re.compile(r'(?i)euro\s*[0-6ivx]|euro\b|eev|schadstoffklasse|abgasklasse|europolluant|emissions? polluantes')
          print('Lecture du', datetime.datetime.utcnow().isoformat(timespec='minutes'), 'UTC')

          def get(url, tries=1):
            for k in range(tries):
              data, ctype = get1(url)
              if data is not None: return data, ctype
              if k + 1 < tries: __import__('time').sleep(20)
            return None, None

          def get1(url):
            try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                return r.read(), r.headers.get_content_type()
            except Exception as e:
              print('  ÉCHEC', url, e)
              return None, None

          def text_of(data, ctype):
            if ctype == 'application/pdf':
              open('/tmp/p.pdf', 'wb').write(data)
              return subprocess.run(['pdftotext', '-layout', '/tmp/p.pdf', '-'], capture_output=True, text=True).stdout
            t = data.decode('utf-8', 'ignore')
            t = re.sub(r'(?s)<script.*?</script>|<style.*?</style>', ' ', t)
            return re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', t)))

          def snippets(url, t, width=400, limit=25):
            n = 0
            for m in KEY.finditer(t):
              if n >= limit: break
              n += 1
              print('   …', t[max(0, m.start() - width):m.end() + width].replace('\n', ' '), '…')
            if n == 0: print('   (aucune mention Euro)')

          def full(url, limit=20000):
            print('\n=====', url)
            data, ctype = get(url)
            if data is None: return
            t = text_of(data, ctype)
            print(t[:limit])

          def crawl(start, words, maxpages=20):
            print('\n##########', start)
            data, ctype = get(start)
            if data is None: return
            host = urllib.parse.urlparse(start).netloc
            raw = data.decode('utf-8', 'ignore')
            links = []
            for h in re.findall(r'href="([^"#]+)"', raw):
              u = urllib.parse.urljoin(start, html.unescape(h))
              if urllib.parse.urlparse(u).netloc != host: continue
              if any(w in u.lower() for w in words) and u not in links: links.append(u)
            print('Liens retenus :', len(links))
            for u in [start] + links[:maxpages]:
              d, c = get(u)
              if d is None: continue
              print('\n=====', u, '(' + str(c) + ')')
              snippets(u, text_of(d, c))

          # Tyrol : textes consolidés (RIS).
          def full(url, limit=20000, tries=1):
            print('\n=====', url)
            data, ctype = get(url, tries)
            if data is None: return False
            print(text_of(data, ctype)[:limit])
            return True

          for n in ['20000637', '20000313', '20000636']:
            if not full(f'https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=LrT&Gesetzesnummer={n}', tries=4):
              full(f'https://ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=LrT&Gesetzesnummer={n}', tries=2)

          # Fréjus (SFTRF côté français, SITAF côté italien), Mont-Blanc (GEIE-TMB, ATMB).
          # Lu au premier passage (21/11/2026) : SFTRF, SITAF, ATMB. Passage 2 : RIS et OCR de l'arrêté seulement.
          if False: crawl('https://www.sftrf.fr/abonnements/', ['tunnel', 'tarif', 'abonnement', 'regle', 'règle', 'circulation', 'pdf', 'acces', 'accès', 'poids'])
          if False: crawl('https://www.sftrf.fr/', ['tunnel', 'tarif', 'regle', 'règle', 'circulation', 'pdf', 'acces', 'accès', 'poids', 'euro'])
          if False: crawl('https://www.sitaf.it/fr/tarifs-et-abonnements-t4/', ['t4', 'tarif', 'regol', 'pdf', 'circul'])
          if False: crawl('https://www.tunnelmb.net/fr', ['tarif', 'regle', 'règle', 'circulation', 'poids', 'pdf', 'euro', 'reglement'])
          if False: crawl('https://www.atmb.com/', ['tunnel', 'tarif', 'poids', 'euro', 'pdf'])

          # Mont-Blanc : arrêté 2009-3425 (règlement de circulation) — ONU 3077 / 3082 (phase 5b bis).
          print('\n##### Arrêté 2009-3425 (Bison Futé)')
          d, c = get('https://www.bison-fute.gouv.fr/IMG/pdf/04_ARP_2009_3425' + '_modif_reglement_circulation.pdf')
          if d is not None:
            open('/tmp/a.pdf', 'wb').write(d)
            subprocess.run(['pdftoppm', '-r', '200', '-png', '/tmp/a.pdf', '/tmp/a'])
            import glob
            t = ''
            for img in sorted(glob.glob('/tmp/a*.png')):
              t += subprocess.run(['tesseract', img, '-', '-l', 'fra'], capture_output=True, text=True).stdout
            print(t[:15000])
            print('Longueur du texte :', len(t))
            for m in re.finditer(r'(?i)3077|3082|2919|onu', t):
              print('   …', t[max(0, m.start() - 300):m.end() + 300].replace('\n', ' '), '…')
