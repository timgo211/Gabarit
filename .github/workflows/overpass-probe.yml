name: Sonde Overpass (temporaire)

on:
  push:
    branches: [claude/phase-5b-adr-tunnels-rr2a83]
    paths: [tools/overpass-probe.mjs, .github/workflows/overpass-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/overpass-probe.mjs
