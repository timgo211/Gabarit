name: DiaLog (copie)

# Copie hebdomadaire des limites de hauteur et de poids de la Base nationale de la réglementation de circulation
# (DiaLog, Licence Ouverte 2.0) dans data/dialog/ (voir tools/dialog-update.mjs et tools/dialog-convert.mjs).
# Domaines lus : www.data.gouv.fr, static.data.gouv.fr, dialog.beta.gouv.fr (contrôlés par le code). Aucun secret.
# Si le téléchargement ou la lecture échoue, les anciens fichiers restent et le journal le dit.
# Aussi lançable à la main : onglet Actions › DiaLog (copie) › Run workflow (depuis main).

on:
  schedule:
    - cron: '53 4 * * 1' # lundi 4 h 53 (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dialog-copie
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Télécharger et convertir
        run: node tools/dialog-update.mjs
      - name: Taille de la copie
        run: du -sh data/dialog && ls data/dialog | wc -l
      - name: Enregistrer si changé
        run: |
          git add -A -N data/dialog
          if git diff --quiet -- data/dialog; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/dialog
          git commit -m "Données : DiaLog (mise à jour automatique)"
          git pull --rebase
          git push
