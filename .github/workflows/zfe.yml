name: ZFE (base nationale)

# Copie hebdomadaire de la Base nationale consolidée des zones à faibles émissions (transport.data.gouv.fr,
# licence ODbL) dans data/zfe.json (voir src/lib/zfe-convert.js). Aussi lançable à la main : onglet Actions ›
# ZFE (base nationale) › Run workflow.

on:
  schedule:
    - cron: '41 4 * * 1' # lundi 4 h 41 (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Télécharger et convertir
        run: node tools/zfe-update.mjs
      - name: Enregistrer si changé
        run: |
          if git diff --quiet -- data/zfe.json; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zfe.json
          git commit -m "Données : ZFE (mise à jour automatique)"
          git pull --rebase
          git push
