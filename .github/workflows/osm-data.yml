name: Données OSM (tunnels ADR, aires PL, accès)

# Copie mensuelle des données OpenStreetMap (licence ODbL) lues sans réseau par l'appli : tunnels signalés aux
# matières dangereuses (data/tunnels-adr.json, phase 5b), aires et parkings PL (data/aires-osm/, phase 9b) et voies à
# accès conditionnel (data/acces-osm/, phase 5d), plus le réseau des taxes PL régionales (data/taxes-pl-osm.json,
# phase 5h ter : extrait France découpé au cadre des taxes). Un seul téléchargement des extraits par pays de Geofabrik
# et un seul filtrage osmium pour les trois premiers (voir tools/osm-update.mjs). Échec : rien n'est enregistré,
# l'ancienne copie reste.
# Lancement à la main avec « r411 » coché : lecture seule du Code de la route, art. R411-8 (pouvoir de police), texte
# écrit dans le journal pour être cité dans src/lib/access-conditional.js ; aucune copie de données ce jour-là.
# Lancée aussi à la main (onglet Actions › Données OSM › Run workflow) et à chaque envoi qui modifie l'outil de copie,
# sur n'importe quelle branche (première copie des aires créée sur la branche de la phase 9b, avant la fusion).

on:
  schedule:
    - cron: '17 3 1 * *' # le 1er du mois, 3 h 17 (UTC)
  workflow_dispatch:
    inputs:
      r411:
        description: "Lire seulement le Code de la route, art. R411-8 (journal), sans copier les données"
        type: boolean
        default: false
  push:
    paths:
      - tools/osm-update.mjs
      - src/lib/tunnels-convert.js
      - src/lib/areas-osm-data.js
      - src/lib/access-convert.js
      - src/lib/hgv-tolls-convert.js
      - src/lib/hgv-tolls-geo.js
      - data/taxes-pl.json
      - .github/workflows/osm-data.yml

permissions:
  contents: write

concurrency:
  # Lecture R411-8 à part : elle n'annule jamais une copie en cours.
  group: osm-data-${{ github.ref }}-${{ inputs.r411 && 'r411' || 'copie' }}
  cancel-in-progress: true

jobs:
  # Recoupement des tunnels de Fourvière, du Fréjus et du Mont-Blanc avec OpenStreetMap (API principale d'OSM et
  # Nominatim, sans Overpass) : journal seulement, n'empêche jamais la copie.
  known:
    if: ${{ !inputs.r411 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/osm-update.mjs --known

  # Code de la route, art. R411-8 : Légifrance est bloqué depuis le conteneur de développement ; lu ici (Légifrance,
  # sinon le PDF du code sur codes.droit.org). Journal seulement, lancé à la main.
  r411:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.r411 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Installer pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Lire l'article R411-8
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) Gabarit"
          for u in "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006842210" \
                   "https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074228/LEGISCTA000006159537/"; do
            code=$(curl -sS -L -A "$UA" -o page.html -w '%{http_code}' "$u" || echo 000)
            echo "Légifrance $u : HTTP $code"
            if [ "$code" = 200 ]; then
              python3 - <<'PY'
          import html, re
          t = open('page.html', encoding='utf-8', errors='replace').read()
          t = re.sub(r'<(script|style)[^>]*>.*?</\1>', ' ', t, flags=re.S)
          t = html.unescape(re.sub(r'<[^>]+>', ' ', t))
          t = re.sub(r'\s+', ' ', t)
          i = t.find('R411-8')
          print(t[max(0, i - 200):i + 2500] if i >= 0 else 'R411-8 absent de la page')
          PY
            fi
          done
          code=$(curl -sS -L -A "$UA" -o code.pdf -w '%{http_code}' "https://codes.droit.org/PDF/Code%20de%20la%20route.pdf" || echo 000)
          echo "codes.droit.org : HTTP $code"
          if [ "$code" = 200 ]; then
            pdftotext code.pdf code.txt
            head -c 300 code.txt; echo
            # Numéro écrit « R411-8 », « R. 411-8 » ou coupé en fin de ligne selon l'édition.
            if grep -n -i -E "R\.? ?411-8([^0-9]|$)" code.txt > hits.txt; then
              cat hits.txt | head -20
              # Titre de l'article seul sur sa ligne (« R. 411-8 ») : texte des lignes suivantes.
              n=$(grep -n -E "^(Article )?R\. ?411-8 *$" code.txt | head -1 | cut -d: -f1)
              if [ -n "$n" ]; then sed -n "$((n - 3)),$((n + 25))p" code.txt; fi
            else
              echo "Article R411-8 absent du PDF"
              grep -n -i -E "411-[0-9]" code.txt | head -20
            fi
          fi

  update:
    if: ${{ !inputs.r411 }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Installer osmium
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: Télécharger les extraits, filtrer et convertir
        run: node tools/osm-update.mjs
      - name: Enregistrer si changé
        run: |
          git add -A -N data/tunnels-adr.json data/aires-osm data/acces-osm data/osm-poly data/taxes-pl-osm.json
          if git diff --quiet -- data/tunnels-adr.json data/aires-osm data/acces-osm data/osm-poly data/taxes-pl-osm.json; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/tunnels-adr.json data/aires-osm data/acces-osm data/osm-poly data/taxes-pl-osm.json
          git commit -m "Données : tunnels ADR, aires PL, accès conditionnels et réseau des taxes PL OpenStreetMap (mise à jour automatique)"
          git pull --rebase
          git push
