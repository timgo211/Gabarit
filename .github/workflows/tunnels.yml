name: Tunnels ADR (OpenStreetMap)

# Copie hebdomadaire des tunnels signalés aux matières dangereuses (OpenStreetMap, licence ODbL) dans
# data/tunnels-adr.json (voir src/lib/tunnels-convert.js). Lancée aussi à la main (onglet Actions › Tunnels ADR ›
# Run workflow, une fois le fichier sur main) et à chaque envoi qui modifie l'outil de copie, sur n'importe quelle
# branche : le premier fichier est ainsi créé sur la branche de la phase 5b, avant la fusion.

on:
  schedule:
    - cron: '17 3 * * 2' # mardi 3 h 17 (UTC)
  workflow_dispatch:
  push:
    paths:
      - tools/tunnels-update.mjs
      - src/lib/tunnels-convert.js
      - .github/workflows/tunnels.yml

permissions:
  contents: write

concurrency:
  group: tunnels-${{ github.ref }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Interroger Overpass et convertir
        run: node tools/tunnels-update.mjs
      - name: Enregistrer si changé
        run: |
          git add -N data/tunnels-adr.json
          if git diff --quiet -- data/tunnels-adr.json; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tunnels-adr.json
          git commit -m "Données : tunnels ADR (mise à jour automatique)"
          git pull --rebase
          git push
