name: Contours IGN (Admin Express, taxes PL)

# Télécharge les contours IGN Admin Express COG (millésime le plus récent du WFS de la Géoplateforme) utiles aux taxes
# PL régionales (Bas-Rhin, Haut-Rhin, Grand Est, Meurthe-et-Moselle, Eurométropole de Strasbourg), les simplifie
# (tools/contours-ign.mjs) et pousse data/contours-ign.json sur la branche. data.geopf.fr est bloqué depuis le
# conteneur de développement. data/taxes-pl.json n'est jamais modifié ici (remplacement relu à part, avec le test de
# non-régression de la phase 5h ter) : la copie OSM n'est donc pas relancée.
# Lancée à chaque envoi qui modifie l'outil ou ce fichier, et à la main.

on:
  workflow_dispatch:
  push:
    paths:
      - tools/contours-ign.mjs
      - .github/workflows/contours-ign.yml

permissions:
  contents: write

concurrency:
  group: contours-ign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contours:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Télécharger et simplifier les contours
        run: node tools/contours-ign.mjs data/contours-ign.json
      - name: Enregistrer data/contours-ign.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contours-ign.json
          if git diff --cached --quiet; then echo "Contours inchangés."; exit 0; fi
          git commit -m "Contours IGN Admin Express (Action Contours IGN)"
          git push
