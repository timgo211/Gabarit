# Phase 5h bis — références OSM des routes du réseau R-Pass (Colmar–Sélestat, RD1363, RD502, RD504, A35, A36, M35).
# ORS (GraphHopper 4.17, EncodingManager.applyWayTags) nomme une étape « name, ref » d'OSM : on lit ces étiquettes dans
# l'extrait Geofabrik de l'Alsace (Overpass injoignable depuis l'Action le 21/11/2026).
# Journal seulement : aucune donnée écrite, aucun commit. À RETIRER AVANT LE MERGE de la PR « 5h bis ».
name: Sources R-Pass OSM (lecture, phase 5h bis)

on:
  workflow_dispatch:
  push:
    branches:
      - ccr-fdafe3a9-5ipepl
    paths:
      - .github/workflows/sources-rpass-osm.yml

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Outils
        run: sudo apt-get install -y osmium-tool > /dev/null
      - name: Extrait Alsace
        run: |
          curl -fsSL -o alsace.osm.pbf https://download.geofabrik.de/europe/france/alsace-latest.osm.pbf
          ls -la alsace.osm.pbf
          osmium tags-filter alsace.osm.pbf w/highway=motorway,trunk,primary,secondary,motorway_link,trunk_link,primary_link -o routes.osm.pbf
          osmium export routes.osm.pbf -f geojsonseq --geometry-types=linestring -a type,id -o routes.geojsonseq
          wc -l routes.geojsonseq
      - name: Lire les références
        shell: python3 {0}
        run: |
          import json, re, collections
          agg = collections.OrderedDict()
          WANT = re.compile(r'\b(A ?3[56]|M ?35|R?D ?(83|1083|1363|502|504)|N ?83|RN ?83)\b')
          for line in open('routes.geojsonseq', encoding='utf-8'):
            line = line.strip().lstrip('\x1e')
            if not line: continue
            f = json.loads(line)
            p = f['properties']
            ref = p.get('ref', ''); name = p.get('name', ''); hw = p.get('highway', '')
            coords = f['geometry']['coordinates']
            lons = [c[0] for c in coords]; lats = [c[1] for c in coords]
            corridor = any(7.30 <= x <= 7.50 and 48.06 <= y <= 48.28 for x, y in coords) and hw in ('motorway', 'trunk', 'primary')
            if not (WANT.search(ref) or corridor): continue
            key = (ref, name if corridor else '', hw)
            b = agg.setdefault(key, [999, 999, -999, -999, 0, set()])
            b[0] = min(b[0], min(lons)); b[1] = min(b[1], min(lats)); b[2] = max(b[2], max(lons)); b[3] = max(b[3], max(lats)); b[4] += 1
            if name: b[5].add(name)
          print('ref | nom (couloir Colmar–Sélestat) | highway | voies | cadre | quelques noms')
          for (ref, name, hw), b in sorted(agg.items(), key=lambda kv: (kv[0][0], kv[0][2])):
            names = '; '.join(sorted(b[5])[:4])
            print(f'{ref!r} | {name!r} | {hw} | {b[4]} | [{b[0]:.3f},{b[1]:.3f},{b[2]:.3f},{b[3]:.3f}] | {names}')
