# Phase 5h bis — enquête (journal seulement, aucune donnée écrite, aucun commit). À RETIRER AVANT LE MERGE.
# 1. A31 en Lorraine (réseau ECPL) : références et noms OSM, pour comprendre « de km 84 à km 97 (A31) ».
# 2. Couloir A35 / D83 et Route des Vins (Alsace) : restrictions PL lues par ORS (maxweight, maxheight, maxlength,
#    maxaxleload, hgv…), pour comprendre pourquoi un 44 t passerait par Bergheim, Orschwiller, Barr.
# Extraits OSM France (miroir download.openstreetmap.fr : Geofabrik injoignable depuis l'Action le 21/11/2026).
name: Sources R-Pass OSM (enquête, phase 5h bis)

on:
  workflow_dispatch:
  push:
    branches:
      - ccr-fdafe3a9-5ipepl
    paths:
      - .github/workflows/sources-rpass-osm.yml

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Outils
        run: sudo apt-get install -y osmium-tool > /dev/null
      - name: Extraits
        run: |
          for r in alsace lorraine; do
            curl -4 -fsSL --retry 3 --retry-delay 10 -o $r.osm.pbf https://download.openstreetmap.fr/extracts/europe/france/$r-latest.osm.pbf \
              || curl -4 -fsSL --retry 3 --retry-delay 10 -o $r.osm.pbf https://download.geofabrik.de/europe/france/$r-latest.osm.pbf
            ls -la $r.osm.pbf
            osmium tags-filter $r.osm.pbf w/highway -o $r-roads.osm.pbf
            osmium export $r-roads.osm.pbf -f geojsonseq --geometry-types=linestring -o $r.geojsonseq
            wc -l $r.geojsonseq
          done
      - name: Lire
        shell: python3 {0}
        run: |
          import json, re, collections
          def ways(path):
            for line in open(path, encoding='utf-8'):
              line = line.strip().lstrip('\x1e')
              if line: yield json.loads(line)
          def box(coords):
            xs = [c[0] for c in coords]; ys = [c[1] for c in coords]
            return [min(xs), min(ys), max(xs), max(ys)]
          def touches(coords, b):
            return any(b[0] <= x <= b[2] and b[1] <= y <= b[3] for x, y in coords)
          # 1. A31 et autoroutes / voies rapides du sillon lorrain (Luxembourg → sud de Toul).
          print('##### Lorraine : voies motorway / trunk entre 48,55 et 49,52° N, 5,8 à 6,4° E (ref | nom | highway | voies | cadre)')
          agg = collections.OrderedDict()
          for f in ways('lorraine.geojsonseq'):
            p = f['properties']; hw = p.get('highway', '')
            if hw not in ('motorway', 'trunk'): continue
            c = f['geometry']['coordinates']
            if not touches(c, [5.80, 48.55, 6.40, 49.52]): continue
            k = (p.get('ref', ''), p.get('name', ''), hw)
            b = agg.setdefault(k, [999, 999, -999, -999, 0]); bb = box(c)
            b[0] = min(b[0], bb[0]); b[1] = min(b[1], bb[1]); b[2] = max(b[2], bb[2]); b[3] = max(b[3], bb[3]); b[4] += 1
          for (ref, name, hw), b in sorted(agg.items(), key=lambda kv: (kv[0][0], -kv[1][4])):
            if b[4] < 2 and not re.search(r'A ?31', ref): continue
            print(f'  {ref!r} | {name!r} | {hw} | {b[4]} | [{b[0]:.3f},{b[1]:.3f},{b[2]:.3f},{b[3]:.3f}]')
          # 2. Restrictions PL en Alsace : couloir Mulhouse – Strasbourg (A35, D83, M35) et Route des Vins.
          KEYS = ['maxweight', 'maxheight', 'maxlength', 'maxwidth', 'maxaxleload', 'hgv', 'hgv:conditional',
                  'maxweight:conditional', 'maxlength:conditional', 'motor_vehicle', 'motor_vehicle:conditional', 'access',
                  'goods', 'maxweightrating', 'maxweight:hgv', 'maxheight:physical']
          for title, b, hws in [
            ('Couloir A35 / D83 / M35 Mulhouse – Strasbourg (motorway, trunk et bretelles)', [7.25, 47.70, 7.80, 48.62],
             ('motorway', 'trunk', 'motorway_link', 'trunk_link')),
            ('Route des Vins Bergheim – Barr (primary à tertiary)', [7.30, 48.18, 7.50, 48.45],
             ('primary', 'secondary', 'tertiary', 'unclassified', 'residential')),
          ]:
            print(f'\n##### {title} : voies avec restriction (ref | nom | highway | étiquettes | cadre)')
            n = 0
            for f in ways('alsace.geojsonseq'):
              p = f['properties']; hw = p.get('highway', '')
              if hw not in hws: continue
              c = f['geometry']['coordinates']
              if not touches(c, b): continue
              tags = {k: p[k] for k in KEYS if k in p}
              if not tags or tags.get('access') in ('yes',) and len(tags) == 1: continue
              if set(tags) <= {'motor_vehicle', 'access'} and all(v in ('yes', 'designated') for v in tags.values()): continue
              n += 1
              if n <= 120:
                bb = box(c)
                print(f"  {p.get('ref', '')!r} | {p.get('name', '')!r} | {hw} | {tags} | [{bb[0]:.3f},{bb[1]:.3f},{bb[2]:.3f},{bb[3]:.3f}]")
            print(f'  total : {n} voies')
