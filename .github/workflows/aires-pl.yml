name: Aires PL officielles

# Copie hebdomadaire du jeu officiel des aires de stationnement PL (Bison Futé, Licence Ouverte Etalab v2.0) dans
# data/aires-pl.json : les tableurs ne sont pas lisibles par le navigateur (voir src/lib/areas-official.js).
# Aussi lançable à la main : onglet Actions › Aires PL officielles › Run workflow.

on:
  schedule:
    - cron: '17 4 * * 1' # lundi 4 h 17 (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Télécharger et convertir
        run: node tools/aires-pl-update.mjs
      - name: Enregistrer si changé
        run: |
          if git diff --quiet -- data/aires-pl.json; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aires-pl.json
          git commit -m "Données : aires PL officielles (mise à jour automatique)"
          git push
